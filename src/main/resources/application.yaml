spring:
  application:
    name: controle-medicamento
  security:
    user:
      name: admin
      password: adminpass
      roles: ADMIN
  datasource:
    url: ${DATABASE_URL}
    user: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
server:
  port: 8081